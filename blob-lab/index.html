<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1233">
<title>Blob Lab</title>
<style>
:root{--bg:#05030f;--panel:rgba(24,17,58,.94);--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.06);--cyan:#6cf0ff;--violet:#8b6cff;--pink:#ff3d7f;--gold:#ffd23c;--orange:#ff8a3c;--muted:rgba(255,255,255,.62);--r:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}

#ui{position:fixed;inset:0;pointer-events:none}
#ui button{pointer-events:auto;font-family:inherit;cursor:pointer;color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.screen.on{display:flex;animation:fade .22s ease-out}
#menu{padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.dim{background:rgba(5,3,15,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto}
/* HUD */
.hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 10px;border-radius:19px;background:rgba(0,0,0,.34);border:1px solid var(--line);font-weight:800;font-size:17px;transition:opacity .25s,transform .25s}
#top{right:12px}
#bestChip{left:12px;color:var(--muted);font-size:14px}
#bestChip svg{width:18px;height:18px;color:var(--gold)}
.hud.hide{opacity:0;transform:translateY(-8px)}
#bPause{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.34);display:none;place-items:center}
#bPause.on{display:grid}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2,var(--gold) 45%,#e08a00);box-shadow:0 0 8px rgba(255,210,60,.6);vertical-align:-3px;font-style:normal;flex:none}
/* Menu */
.logo{margin-top:8vh;font-weight:900;font-size:clamp(48px,15vw,82px);line-height:.86;letter-spacing:.02em;text-align:center}
.logo span{display:block;background:linear-gradient(180deg,#fff 10%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(108,240,255,.4))}
.logo span+span{background:linear-gradient(180deg,#ffd0e6 10%,var(--pink));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(255,61,127,.4))}
.dock{margin-top:auto;display:flex;gap:4px;padding:6px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tile{position:relative;width:76px;white-space:nowrap;height:64px;border:none;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted);transition:background .15s,transform .1s}
.tile svg{color:#fff}
.tile:active{background:var(--glass);transform:scale(.94)}
.tile.hidden{display:none}
.badge::after{content:"";position:absolute;top:8px;right:16px;width:10px;height:10px;border-radius:50%;background:#ff3d5a;box-shadow:0 0 0 3px #150f30}
/* Buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:18px;border:1px solid var(--line);margin-top:10px;font-weight:800;font-size:17px;background:var(--glass);transition:transform .1s,opacity .2s}
.btn:active,.sk:active,.x:active{transform:scale(.96)}
.btn.primary{height:60px;border:none;font-size:19px;background:linear-gradient(95deg,var(--cyan),var(--violet));color:#07051a;box-shadow:0 8px 26px rgba(108,240,255,.28)}
.btn.gold{border:none;background:linear-gradient(95deg,var(--gold),var(--orange));color:#2a1300}
.btn[disabled]{opacity:.4}
.btn .i{width:22px;height:22px}
.two{display:flex;gap:10px;width:100%}
.two .btn{flex:1;font-size:15px;height:50px}
.adtag{font-size:10px;font-weight:900;letter-spacing:.04em;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.14);color:var(--muted)}
.btn.gold .adtag{background:rgba(42,19,0,.15);color:#2a1300}
.link{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;margin-top:12px;padding:8px 12px}
/* Cards & panels */
.card,.panel{margin:auto;width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.card{padding:22px 18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.panel{max-height:86vh;display:flex;flex-direction:column;padding:18px}
.lbl{font-size:12px;letter-spacing:.22em;color:var(--muted);font-weight:800}
.big{font-size:88px;font-weight:900;line-height:1;margin:2px 0 4px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.chip svg{width:16px;height:16px}
.chip.gold{color:var(--gold)}
.chip.nb{color:#2a1300;background:linear-gradient(95deg,var(--gold),var(--orange));border:none;animation:pulse .6s infinite alternate}
#nextSkin{width:100%;margin-top:14px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);font-size:13px;color:var(--muted);font-weight:700;text-align:left;display:flex;align-items:center;gap:12px;border:none}
#nextSkin .ball{width:30px;height:30px}
#nextSkin > div{flex:1}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:4px;transition:width .8s .2s}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.phead h2{font-size:22px;font-weight:900}
.phead .chip{margin-left:auto;margin-right:10px}
.x{width:38px;height:38px;border-radius:50%;border:none;background:var(--glass);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-y:auto;padding:2px}
.sk{position:relative;border:1.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:18px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:800;transition:transform .1s}
.sk.eq{border-color:var(--cyan);background:rgba(108,240,255,.1)}
.sk.lock .ball{filter:grayscale(.7) brightness(.55)}
.sk.can{border-color:var(--gold)}
.sk span{color:var(--muted);display:flex;align-items:center;gap:4px;font-size:11px}
.sk .coin{width:13px;height:13px}
.ball{width:40px;height:40px;border-radius:50%;display:block;flex:none}
.shake{animation:shake .35s}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border-radius:16px;padding:10px 2px;background:rgba(255,255,255,.05);border:1.5px solid transparent;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.day b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;color:var(--gold);margin-top:5px}
.day b .coin{width:13px;height:13px}
.day.done{opacity:.35}
.day.now{border-color:var(--gold);background:rgba(255,210,60,.1);color:#fff}
.day.d7{grid-column:span 2}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700}
.setrow span{flex:1}
.sw{width:52px;height:30px;border-radius:15px;border:none;background:rgba(255,255,255,.16);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--cyan)}
.sw.on::after{transform:translateX(22px)}
.muted{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(16px);background:rgba(20,14,48,.95);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#adsim{position:absolute;inset:0;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;z-index:10;text-align:center;padding:20px}
#adsim.on{display:flex}
#adsim div{font-size:44px;font-weight:900;border:3px solid #fff;border-radius:12px;padding:4px 16px}
#adsim p{opacity:.7;max-width:280px}
#adsim b{font-size:30px}
#bestChip .sep{width:1px;height:16px;background:var(--line);margin:0 2px}
#bestChip .lv{color:#fff}
.xprow{width:100%;margin-top:4px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);text-align:left}
.xprow .top{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.xprow .top b{color:#fff;font-size:15px}
.xprow .top .gold{color:var(--gold);display:flex;align-items:center;gap:4px}
.xprow .top small{flex-basis:100%;color:#7dffb0;font-size:12px}
.xprow.up{background:rgba(255,210,60,.1);box-shadow:inset 0 0 0 1.5px rgba(255,210,60,.5)}
.bar.xp i{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.mlist{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.04);text-align:left;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.85)}
.mi > div{flex:1;min-width:0}
.mi .bar{height:5px;margin-top:5px}
.mi .rw{display:flex;align-items:center;gap:3px;color:var(--gold);font-size:12px;font-weight:800;flex:none}
.mi .rw .coin{width:12px;height:12px}
.mi.done{background:rgba(125,255,176,.1);color:#7dffb0}
.mi.done .bar i{background:#7dffb0}
.mi .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none;font-size:12px}
.mi.done .ck{background:#7dffb0;color:#0b2a18}
.big-mi .mi{padding:12px;font-size:14px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:12px}
.tab{flex:1;height:36px;border:none;border-radius:10px;background:transparent;font-weight:800;font-size:14px;color:var(--muted)}
.tab.on{background:rgba(255,255,255,.12);color:#fff}
#upList{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.up{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.up .ico{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center}
.up .ico svg{width:22px;height:22px;stroke:#fff}
.up > div{flex:1;min-width:0}
.up b{font-size:14px}
.up p{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--gold)}
.ubtn{height:40px;min-width:74px;padding:0 10px;border-radius:12px;border:none;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(95deg,var(--gold),var(--orange));color:#2a1300;flex:none}
.ubtn[disabled]{background:rgba(255,255,255,.08);color:var(--muted)}
.ubtn .coin{width:13px;height:13px}
.up.lock{opacity:.55}
.lvcard{padding:14px;border-radius:18px;background:rgba(255,255,255,.05);margin-bottom:12px}
.lvcard .row1{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.lvcard .row1 span{color:var(--muted);font-size:13px}
.lvcard p{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.noadsrow{margin-top:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ---- Blob Lab v2 ---- */
#c{position:fixed;inset:0;display:block}
[hidden]{display:none!important}
:root{--panel:rgba(30,20,62,.96)}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;padding:0 10px}
#hud button{pointer-events:auto}
.hrow{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.money{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 18px rgba(0,0,0,.3)}
.coin.big{width:26px;height:26px}
.rate{font-size:13px;font-weight:800;color:#fff;background:rgba(0,0,0,.28);padding:3px 10px;border-radius:10px;margin-top:-2px}
#multTag{color:var(--gold);margin-left:6px}
.hudchip{height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(10,6,30,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-weight:800;font-size:14px;min-width:64px;justify-content:center}
.hudchip svg{width:17px;height:17px;color:var(--gold)}
.gemI{display:inline-block;width:15px;height:15px;background:linear-gradient(135deg,#9ff3ff,#3aa0ff 50%,#7a4dff);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);flex:none;font-style:normal}
#tabs{display:flex;gap:6px;margin-top:4px;pointer-events:auto;background:rgba(10,6,30,.35);padding:4px;border-radius:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rtab{position:relative;width:48px;height:40px;border-radius:12px;border:none;background:transparent;font-size:20px;display:grid;place-items:center;color:#fff;filter:saturate(.9)}
.rtab.on{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.rtab.lock{opacity:.45;filter:grayscale(1)}
.rtab .lk{position:absolute;right:2px;bottom:0;font-size:11px}
.rtab.badge::after{top:3px;right:5px}
#sideR{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 150px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
#sideR > *{pointer-events:auto}
.side{height:34px;display:flex;align-items:center;gap:5px;padding:0 10px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:rgba(10,6,30,.5);font-weight:800;font-size:13px;color:#fff}
.side svg{width:16px;height:16px}
#robotChip,#orderChip,#petChip{cursor:pointer}
#orderChip:active,#petChip:active{transform:scale(.93)}
.side .ic{font-size:14px;line-height:1}
#orderChip{background:rgba(26,74,48,.72);border-color:rgba(125,255,176,.45)}
#orderChip.ready{animation:ordPulse 1.2s infinite}
#petChip{background:rgba(70,24,52,.72);border-color:rgba(255,143,181,.45)}
@keyframes ordPulse{0%,100%{box-shadow:0 0 0 0 rgba(125,255,176,.55)}50%{box-shadow:0 0 0 7px rgba(125,255,176,0)}}
#robotChip:active{transform:scale(.93)}
#robotChip.off{opacity:.5}
#robotChip.off svg{color:#ff8a95}
#robotChip.off #robotT{text-decoration:line-through}
#bBoost.on{background:linear-gradient(95deg,var(--gold),var(--orange));color:#2a1300;border:none}
#bBoost.on .adtag{display:none}
.portalc{background:linear-gradient(95deg,#b28cff,#6a3fd1);border:none;animation:pulse .8s infinite alternate;transform-origin:right center}
.robot{color:#aef}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom) + 8px + var(--banner,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bottom > *{pointer-events:auto}
.buyrow{display:flex;gap:8px;width:min(440px,100%);align-items:center}
.sq{position:relative;width:54px;height:62px;flex:none;border-radius:18px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.sq .adtag{position:absolute;bottom:4px;right:4px}
.sq.gift svg{color:var(--gold)}
#incub{position:relative;width:60px;height:60px;flex:none;border-radius:50%;border:none;background:var(--panel);display:grid;place-items:center;--p:0}
#incub .ringp{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1turn),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(circle,transparent 25px,#000 26px);mask:radial-gradient(circle,transparent 25px,#000 26px)}
#incub .boxic{width:26px;height:22px;border-radius:4px;background:linear-gradient(#ff9ad5,#c43d8f);position:relative;margin-top:-10px;box-shadow:inset 0 5px 0 #ff7ac4}
#incub .boxic::after{content:"";position:absolute;left:10px;top:0;width:6px;height:100%;background:#ffd23c}
#incub b{position:absolute;bottom:9px;font-size:11px;font-weight:900}
#incub.full .ringp{background:conic-gradient(#ff5a6a 1turn,transparent 0)}
#incub.full b{color:#ff8a95}
#incub:active{transform:scale(.92)}
#incub.tick{animation:tick .18s}
@keyframes tick{50%{transform:scale(1.1)}}
.btn.buy{flex:1;width:auto;min-width:0;height:62px;margin:0;justify-content:space-between;padding:0 8px 0 2px;font-size:14px;gap:4px}
.btn.buy .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;flex:1;margin-left:2px;min-width:0}
.btn.buy .bt small{font-size:11px;opacity:.75;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.buy .price{display:flex;align-items:center;gap:4px;background:rgba(7,5,26,.18);padding:6px 7px;border-radius:12px;font-size:14px;flex:none}
.btn.buy.cant{filter:saturate(.3) brightness(.8)}
#buyIcon{width:44px;height:44px;flex:none}
#bottom .dock{margin:0;width:min(440px,100%);justify-content:space-around}
#bottom .tile{width:auto;flex:1}
.list{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.up{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.up .ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:20px}
.up .ico svg{width:22px;height:22px}
.up > div{flex:1;min-width:0}
.up b{font-size:14px}
.up p{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.up .bar{height:6px;margin-top:6px}
.up.done{background:rgba(125,255,176,.08);border-color:rgba(125,255,176,.35)}
.ubtn{height:42px;min-width:84px;padding:0 10px;border-radius:12px;border:none;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(95deg,var(--gold),var(--orange));color:#2a1300;flex:none}
.ubtn.gemb{background:linear-gradient(95deg,#7fe3ff,#6a7bff);color:#07102a}
.ubtn.starb{background:linear-gradient(95deg,#d8b8ff,#8b5cff);color:#140a2a}
.ubtn[disabled]{background:rgba(255,255,255,.08);color:var(--muted)}
.ubtn .coin{width:13px;height:13px}
.chip.gemc{color:#9fe8ff}
.sech{font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--muted);margin:6px 2px 0;text-transform:uppercase}
.rtabs{display:flex;gap:6px;margin-bottom:10px}
.rtabs button{flex:1;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:18px}
.rtabs button.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
#bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;overflow-y:auto;padding:2px}
